document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

px 0 0;text-decoration:none}.dv-olabel{display:flex;align-items:baseline;gap:8px;font:400 11px/1.3 'Source Sans 3',ui-sans-serif,sans-serif;color:rgba(0,0,0,.55)}.dv-card{max-width:100%;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:0 10px 0 0;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden}.dv-opt:target .dv-oid{background:#2a78d6;color:#fff}.dv-next{margin:22px 0 0;font:12px/1.5 'Source Sans 3',ui-sans-serif,sans-serif;color:rgba(0,0,0,.5)}<\u002Fstyle><\u002Fhelmet>\n\n<section class=\"dv-turn\" id=\"t1\">\n<div class=\"dv-thd\"><a class=\"dv-tid\" href=\"#t1\">1<\u002Fa><span class=\"dv-tname\">Doorklikbaar wireframe en twee alternatieve overzichten<\u002Fspan><\u002Fdiv>\n<div class=\"dv-opts\">\n\n<div class=\"dv-opt\" id=\"1a\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#1a\">1a<\u002Fa>Doorklikbaar: overzicht → product → epic (swimlane-roadmap)<\u002Fdiv>\n<div class=\"dv-card\" style=\"width:1340px\">\n<div sc-camel-on-click=\"{{ onClick }}\" style=\"padding:26px 30px 34px;background:#ffffff\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;gap:24px;border-bottom:3px solid #a80061;padding-bottom:14px;margin-bottom:22px\">\n<div style=\"display:flex;align-items:center;gap:15px;flex:none\">\n<img alt=\"Rijksoverheid\" src=\"1d92b82d-0cc6-4853-a3c5-2c3a0d3ffee6\" style=\"display:block;width:37px;height:74px\">\n<div style=\"font:600 14.5px/1.35 'Source Sans 3',ui-sans-serif,sans-serif;color:#154273\">Rijksdienst voor<br>Ondernemend Nederland<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{ isOverview }}\" hint-placeholder-val=\"{{ true }}\">\n<div>\n<img alt=\"\" src=\"b2e1b2ab-afb8-4c67-855b-cc31c6475c5b\" style=\"display:block;width:100%;height:auto;margin-bottom:24px\">\n<div style=\"display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px dashed #c3d4e0;padding-bottom:14px;margin-bottom:24px\">\n<div>\n<div style=\"font:600 28px/1.2 'Source Sans 3',ui-sans-serif,sans-serif;color:#154273\">Jaarplan IDAI 2027<\u002Fdiv>\n<div style=\"font:400 13px/1.4 'Source Sans 3',ui-sans-serif,sans-serif;color:#54687d;margin-top:4px\">Deelportfolio Data en AI, drie product(domein)en en 19 epics<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font:400 11.5px/1.4 'Source Sans 3',ui-sans-serif,sans-serif;color:#7d8fa0;text-align:right\">wireframe, kwartaalplanning is indicatief<br>klik een product of een epic aan<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;gap:18px;margin-bottom:34px\">\n<div data-theme=\"AI\" style=\"flex:1;cursor:pointer;border:2px solid #a80061;border-radius:0 14px 0 0;background:#fdeef6;padding:0 0 16px;overflow:hidden\">\n<div style=\"height:8px;background:#a80061\"><\u002Fdiv>\n<div style=\"padding:16px 18px 0\">\n<div style=\"font:600 19px/1.25 'Source Sans 3',ui-sans-serif,sans-serif;color:#7a0046\">Product AI<\u002Fdiv>\n<div style=\"font:400 11px 'Source Sans 3',ui-sans-serif,sans-serif;color:#7d8fa0;margin-top:2px\">Martin Orbons<\u002Fdiv>\n<div style=\"font:400 12.5px/1.5 'Source Sans 3',ui-sans-serif,sans-serif;color:#2a3b4d;margin-top:8px;min-height:54px\">Platform, generieke AI-producten en doorlopende AI-governance. De lijn loopt van taalmodellen via RAG naar agentic AI, met een soeverein alternatief eronder.<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:14px;font:600 12px 'Source Sans 3',ui-sans-serif,sans-serif;color:#7a0046\"><span>3 doelstellingen, 6 epics<\u002Fspan><span>Bekijk epics →<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div data-theme=\"PT\" style=\"flex:1;cursor:pointer;border:2px solid #154273;border-radius:0 14px 0 0;background:#e8f0f7;padding:0 0 16px;overflow:hidden\">\n<div style=\"height:8px;background:#154273\"><\u002Fdiv>\n<div style=\"padding:16px 18px 0\">\n<div style=\"font:600 19px/1.25 'Source Sans 3',ui-sans-serif,sans-serif;color:#0e2e52\">Product Platform Transitie<\u002Fdiv>\n<div style=\"font:400 11px 'Source Sans 3',ui-sans-serif,sans-serif;color:#7d8fa0;margin-top:2px\">Samir Kouidi<\u002Fdiv>\n<div style=\"font:400 12.5px/1.5 'Source Sans 3',ui-sans-serif,sans-serif;color:#2a3b4d;margin-top:8px;min-height:54px\">Migratie van SAS en GEO naar een hybride platform (GDP cloud + GDP on-premise), golfsgewijs per datacapability. Programmaduur 5 tot 7 jaar.<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:14px;font:600 12px 'Source Sans 3',ui-sans-serif,sans-serif;color:#0e2e52\"><span>3 doelstellingen, 5 epics<\u002Fspan><span>Bekijk epics →<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div data-theme=\"KD\" style=\"flex:1;cursor:pointer;border:2px solid #8fc9e8;border-radius:0 14px 0 0;background:#eaf5fb;padding:0 0 16px;overflow:hidden\">\n<div style=\"height:8px;background:#8fc9e8\"><\u002Fdiv>\n<div style=\"padding:16px 18px 0\">\n<div style=\"font:600 19px/1.25 'Source Sans 3',ui-sans-serif,sans-serif;color:#14476b\">Product Datamanagement<\u002Fdiv>\n<div style=\"font:400 11px 'Source Sans 3',ui-sans-serif,sans-serif;color:#7d8fa0;margin-top:2px\">Eigenaar nog te bepalen<\u002Fdiv>\n<div style=\"font:400 12.5px/1.5 'Source Sans 3',ui-sans-serif,sans-serif;color:#2a3b4d;margin-top:8px;min-height:54px\">Het datafundament, gestart bij klantdata: begrippen, catalogus, kwaliteit, beleidsgestuurde toegang, masterdata en de marktplaats. Inclusief dataclassificatie (voorheen P1) en Financieel solide.<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:14px;font:600 12px 'Source Sans 3',ui-sans-serif,sans-serif;color:#14476b\"><span>3 doelstellingen, 8 epics<\u002Fspan><span>Bekijk epics →<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"border:2px solid #b8cdda;border-radius:0 14px 0 0;background:#ffffff;padding:20px 22px 24px;margin-bottom:32px\">\n<div style=\"font:600 21px/1.2 'Source Sans 3',ui-sans-serif,sans-serif;color:#154273\">Verbinding met de RVO-strategie<\u002Fdiv>\n<div style=\"font:400 12.5px/1.6 'Source Sans 3',ui-sans-serif,sans-serif;color:#2a3b4d;max-width:940px;margin-top:6px\">IDAI bouwt het datafundament en het AI-platform waarop RVO datagedreven werkt. Dat draagt rechtstreeks bij aan de RVO-strategie, aan de IV-strategie 2026-2030 (thema datagedreven en opgavegericht werken) en aan Datastrategie 1.0. Goed beschreven en beheerde data zijn immers de basis om met AI aan de slag te kunnen.<\u002Fdiv>\n\n<div style=\"display:flex;gap:14px;margin:18px 0 24px\">\n<div style=\"flex:1;border-left:6px solid #154273;border-radius:0 10px 0 0;background:#e8f0f7;padding:12px 16px 14px\">\n<div style=\"font:600 10.5px 'Source Sans 3',ui-sans-serif,sans-serif;color:#54687d\">Portfoliodoelstelling 1<\u002Fdiv>\n<div style=\"font:600 14.5px/1.35 'Source Sans 3',ui-sans-serif,sans-serif;color:#154273;margin-top:3px\">Eén wendbaar en flexibel dataplatform onder governance<\u002Fdiv>\n<div style=\"font:400 12px/1.55 'Source Sans 3',ui-sans-serif,sans-serif;color:#2a3b4d;margin-top:5px\">Medewerkers kunnen veilig en gecontroleerd data delen voor datagedreven besluiten. Het platform maakt innovatieve oplossingen zoals AI mogelijk.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1;border-left:6px solid #154273;border-radius:0 10px 0 0;background:#e8f0f7;padding:12px 16px 14px\">\n<div style=\"font:600 10.5px 'Source Sans 3',ui-sans-serif,sans-serif;color:#54687d\">Portfoliodoelstelling 2<\u002Fdiv>\n<div style=\"font:600 14.5px/1.35 'Source Sans 3',ui-sans-serif,sans-serif;color:#154273;margin-top:3px\">Een stabiele en beheerde IV waarborgen<\u002Fdiv>\n<div style=\"font:400 12px/1.55 'Source Sans 3',ui-sans-serif,sans-serif;color:#2a3b4d;margin-top:5px\">De transitie is meerjarig, dus blijft investeren in het bestaande landschap nodig. Hieronder valt ook het calamiteitenplan en de soevereine omgeving.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:10px\">\n<div style=\"font:600 16px/1.25 'Source Sans 3',ui-sans-serif,sans-serif;color:#154273\">Welke epics dragen bij aan welk strategisch vernieuwingsthema<\u002Fdiv>\n<div style=\"font:400 11px 'Source Sans 3',ui-sans-serif,sans-serif;color:#7d8fa0\">werktitels 2027, eigenaar Datamanagement nog te bepalen<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;gap:8px;margin-bottom:6px\">\n<div style=\"width:266px;flex:none\"><\u002Fdiv>\n<div style=\"flex:1;font:600 12.5px 'Source Sans 3',ui-sans-serif,sans-serif;color:#7a0046\">Product AI<\u002Fdiv>\n<div style=\"flex:1;font:600 12.5px 'Source Sans 3',ui-sans-serif,sans-serif;color:#0e2e52\">Product Platform Transitie<\u002Fdiv>\n<div style=\"flex:1;font:600 12.5px 'Source Sans 3',ui-sans-serif,sans-serif;color:#14476b\">Product Datamanagement<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<sc-for as=\"row\" hint-placeholder-count=\"5\" list=\"{{ doelRows }}\">\n<div style=\"display:flex;gap:8px;align-items:stretch\">\n<div style=\"width:266px;flex:none;border-left:6px solid #154273;border-radius:0 8px 0 0;background:#e8f0f7;padding:9px 12px;display:flex;align-items:center;font:600 12.5px/1.3 'Source Sans 3',ui-sans-serif,sans-serif;color:#154273\">{{ row.label }}<\u002Fdiv>\n<div style=\"flex:1;border:1.5px solid #a80061;border-radius:0 8px 0 0;background:#fdeef6;padding:8px 11px\">\n<div style=\"font:600 13px 'Source Sans 3',ui-sans-serif,sans-serif;color:#15283d\">{{ row.ai }}<\u002Fdiv>\n<sc-if value=\"{{ row.aiE }}\"><div style=\"font:400 11px 'Source Sans 3',ui-sans-serif,sans-serif;color:#54687d;margin-top:2px\">{{ row.aiE }}<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"flex:1;border:1.5px solid #154273;border-radius:0 8px 0 0;background:#e8f0f7;padding:8px 11px\">\n<div style=\"font:600 13px 'Source Sans 3',ui-sans-serif,sans-serif;color:#15283d\">{{ row.pt }}<\u002Fdiv>\n<sc-if value=\"{{ row.ptE }}\"><div style=\"font:400 11px 'Source Sans 3',ui-sans-serif,sans-serif;color 7a0046;align-self:center\">AI<\u002Fdiv>\n<div style=\"border:1.5px solid #a80061;border-radius:0 7px 0 0;background:#fdeef6;padding:7px;font:500 10.5px/1.4 'Source Sans 3',ui-sans-serif,sans-serif\">A1, A3, A4, A6<\u002Fdiv>\n<div style=\"border:1.5px solid #a80061;border-radius:0 7px 0 0;background:#fdeef6;padding:7px;font:500 10.5px/1.4 'Source Sans 3',ui-sans-serif,sans-serif\">plus A2 en A5<\u002Fdiv>\n<div style=\"border:1.5px solid #a80061;border-radius:0 7px 0 0;background:#fdeef6;padding:7px;font:500 10.5px/1.4 'Source Sans 3',ui-sans-serif,sans-serif\">A4 en A6 afgerond<\u002Fdiv>\n<div style=\"border:1.5px solid #a80061;border-radius:0 7px 0 0;background:#fdeef6;padding:7px;font:500 10.5px/1.4 'Source Sans 3',ui-sans-serif,sans-serif\">A1, A2, A3 en A5 opgeleverd<\u002Fdiv>\n\n<div style=\"font:600 14px/1.25 'Source Sans 3',ui-sans-serif,sans-serif;color:#0e2e52;align-self:center\">Platform Transitie<\u002Fdiv>\n<div style=\"border:1.5px solid #154273;border-radius:0 7px 0 0;background:#e8f0f7;padding:7px;font:500 10.5px/1.4 'Source Sans 3',ui-sans-serif,sans-serif\">P2, P4, P6<\u002Fdiv>\n<div style=\"border:1.5px solid #154273;border-radius:0 7px 0 0;background:#e8f0f7;padding:7px;font:500 10.5px/1.4 'Source Sans 3',ui-sans-serif,sans-serif\">P4 klaar, P5 start<\u002Fdiv>\n<div style=\"border:1.5px solid #154273;border-radius:0 7px 0 0;background:#e8f0f7;padding:7px;font:500 10.5px/1.4 'Source Sans 3',ui-sans-serif,sans-serif\">P3 golf 1 start<\u002Fdiv>\n<div style=\"border:1.5px solid #154273;border-radius:0 7px 0 0;background:#e8f0f7;padding:7px;font:500 10.5px/1.4 'Source Sans 3',ui-sans-serif,sans-serif\">P3 loopt door in 2028 en verder<\u002Fdiv>\n\n<div style=\"font:600 14px/1.25 'Source Sans 3',ui-sans-serif,sans-serif;color:#14476b;align-self:center\">Datamanagement<\u002Fdiv>\n<div style=\"border:1.5px solid #8fc9e8;border-radius:0 7px 0 0;background:#eaf5fb;padding:7px;font:500 10.5px/1.4 'Source Sans 3',ui-sans-serif,sans-serif\">D1, D2, D7, D8<\u002Fdiv>\n<div style=\"border:1.5px solid #8fc9e8;border-radius:0 7px 0 0;background:#eaf5fb;padding:7px;font:500 10.5px/1.4 'Source Sans 3',ui-sans-serif,sans-serif\">plus D3 en D4, D7 klaar<\u002Fdiv>\n<div style=\"border:1.5px solid #8fc9e8;border-radius:0 7px 0 0;background:#eaf5fb;padding:7px;font:500 10.5px/1.4 'Source Sans 3',ui-sans-serif,sans-serif\">D1 en D2 klaar, D5 start<\u002Fdiv>\n<div style=\"border:1.5px solid #8fc9e8;border-radius:0 7px 0 0;background:#eaf5fb;padding:7px;font:500 10.5px/1.4 'Source Sans 3',ui-sans-serif,sans-serif\">D3, D4 en D5 klaar, D6 start<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:14px;border-top:2px dashed #c3d4e0;padding-top:12px\">\n<div style=\"font:600 15px/1.25 'Source Sans 3',ui-sans-serif,sans-serif;color:#154273;margin-bottom:6px\">Afhankelijkheden<\u002Fdiv>\n<div style=\"font:400 11px/1.6 'Source Sans 3',ui-sans-serif,sans-serif;color:#2a3b4d\">D7 → D4, P2 → A1, D7 en P2 → P3, D2 → D3, D1 t/m D5 → D6, A6 → A4, A3 → A2<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<p class=\"dv-next\">Try next: \"werk <a class=\"dv-oid\" href=\"#1a\">1a<\u002Fa> uit met echte afhankelijkheidspijlen tussen alle epics\", \"maak van <a class=\"dv-oid\" href=\"#1c\">1c<\u002Fa> de startpagina en houd de detailschermen van <a class=\"dv-oid\" href=\"#1a\">1a<\u002Fa>\", \"voeg per epic voortgang en budget toe\"<\u002Fp>\n<\u002Fsection>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showDependencies&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Roadmap&quot;},&quot;showResultaat&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Epiclijst&quot;}}\">\nclass Component extends DCLogic {\n  state = { view: 'overview', theme: null, epic: null };\n\n  themes = {\n    AI: { title: 'Product AI', owner: 'Martin Orbons', horizon: 'Jaarplan 2027, doorlopend',\n      intro: 'IDAI bouwt en beheert het AI-platform en de generieke AI-producten voor heel RVO; teams bouwen daarop hun eigen toepassingen. De lijn loopt van taalmodellen (RVO GPT) via RAG (AI-migo) naar agentic AI, met een soeverein alternatief eronder.',\n      doelen: [\n        { nr: 1, label: 'Vertrouwelijke en AVG-gevoelige data kan met AI verwerkt worden, doordat er een soeverein en hoogwaardig AI-platform naast de bestaande omgeving staat.', thema: 'AI en data; Modernisering IV; Efficiënte en wendbare uitvoering', epics: ['A1'] },\n        { nr: 2, label: 'Teams bouwen niet elk hun eigen oplossing, maar hergebruiken AI-componenten via één platform en één AI-marktplaats.', thema: 'Efficiënte en wendbare uitvoering; AI en data', epics: ['A3', 'A2', 'A4'] },\n        { nr: 3, label: 'AI komt niet alleen in ontwikkeling maar ook in productie: elk AI-product heeft een eigenaar, draait via een beheerde pipeline en wordt doorlopend getoetst.', thema: 'Efficiënte en wendbare uitvoering; Modernisering IV', epics: ['A6', 'A5'] }\n      ] },\n    PT: { title: 'Product Platform Transitie', owner: 'Samir Kouidi', horizon: '5 tot 7 jaar, golfsgewijs',\n      intro: 'Migratie van de datavoorzieningen SAS en GEO naar een hybride platform: GDP in de cloud (Azure en Databricks) en het nog te ontwikkelen GDP on-premise, binnen het herziene Cloudbeleid van het Rijk. Dataclassificatie en plaatsing (voorheen P1) is naar Datamanagement verplaatst; de GEO-werkplek staat als apart traject buiten de producten.',\n      doelen: [\n        { nr: 1, label: 'Er ligt een vastgestelde hybride doelarchitectuur die functioneel gelijkwaardig is aan SAS en GEO, zodat de eerste migratiegolf in 2027 kan starten.', thema: 'Vernieuwing; Modernisering IV; AI en data', epics: ['P2'] },\n        { nr: 2, label: 'RVO migreert golfsgewijs per datacapability, zonder de beschikbaarheid van data voor klanten en opdrachtgevers te verstoren.', thema: 'Vernieuwing; Modernisering IV; AI en data', epics: ['P3', 'P5'] },\n        { nr: 3, label: 'Besluitvorming over het platform is navolgbaar en meetbaar: tegenspraak is georganiseerd en voortgang, kosten en adoptie zijn per fase zichtbaar.', thema: 'Vernieuwing; Efficiënte en wendbare uitvoering', epics: ['P4', 'P6'] }\n      ] },\n    KD: { title: 'Product Datamanagement', owner: 'Nog te bepalen', horizon: 'Jaarplan 2027, start bij klantdata',\n      intro: 'Het datafundament, gestart bij klantdata: begrippen, vindbaarheid, kwaliteit, toegang en gezaghebbende lijsten. De Data en AI Marktplaats brengt dat samen in één ingang. Dataclassificatie en plaatsing is vanuit Platform Transitie hierheen verplaatst; Financieel solide is als epic toegevoegd.',\n      doelen: [\n        { nr: 1, label: 'In 2027 beschikt RVO over klantdata die vindbaar, begrijpelijk, betrouwbaar en verantwoord bruikbaar is, zodat dezelfde vraag overal hetzelfde antwoord oplevert.', thema: 'Klantgerichte dienstverlening; Efficiënte en wendbare uitvoering; Modernisering IV; AI en data', epics: ['D1', 'D2', 'D3', 'D4', 'D5', 'D8'] },\n        { nr: 2, label: 'Van elke dataset staat vast waar die mag staan, zodat plaatsing aantoonbaar voldoet aan het soevereiniteits- en Cloudbeleid.', thema: 'Modernisering IV; AI en data', epics: ['D7'] },\n        { nr: 3, label: 'Data is via één ingang te vinden en te gebruiken, met verantwoording als bijproduct van de workflow.', thema: 'Klantgerichte dienstverlening; Efficiënte en wendbare uitvoering; AI en data', epics: ['D6'] }\n      ] }\n  };\n\n  openPunten = [\n    { t: 'GEO-werkplek', s: 'Komt terug in 2027 als apart traject naast de producten: raakt de SAS/GEO-migratie, maar is geen epic binnen Platform Transitie. Plaatsing en trekker nog te bepalen (actie PM’s), financiering af te stemmen (actie Carolien).' },\n    { t: 'Impactmonitoring', s: 'Strategisch thema zonder epic. P6 Meetbare sturing komt het dichtst in de buurt en is te koppelen zodra het thema een eigenaar heeft.' },\n    { t: 'Portfoliodoelstellingen', s: 'De portfoliodoelstellingen hierboven zijn die van 2026. Actualiseren naar 2027 en toetsen aan de IV-strategie 2026-2030 en Datastrategie 1.0.' },\n    { t: 'Kostenindicaties', s: 'Alle epics staan op [EUR …]. Bandbreedtes invullen samen met F&C en de productmanagers.' },\n    { t: 'Link met RVO strategische pijlers', s: 'De pijlers zijn nog niet vastgelegd; de kolom met IV-thema’s wordt na 28 september aangevuld.' },\n    { t: 'Productomschrijvingen', s: 'De omschrijvingen per product(domein) komen van het Miro canvas. De teksten hier zijn concept.' }\n  ];\n\n  begrippen = [\n    { t: 'Platform', s: 'De technische omgeving waarop data- en AI-producten draaien (GDP cloud, GDP on-premise, DADEL GDP); geen organisatieonderdeel of applicatie.' },\n    { t: 'AI', s: 'Technieken die uit data patronen leren of taal verwerken. Hier meestal: taalmodellen (LLM), RAG en agentic toepassingen.' },\n    { t: 'AI-systeem', s: 'Een AI-toepassing in gebruik: model, data, koppelingen en gebruiksproces samen. De eenheid voor DPIA, IAMA en BIO.' },\n    { t: 'Agentic AI', s: 'AI die zelf stappen plant en uitvoert met tools, binnen monitoring, eigenaarschap, containment en een noodstop.' },\n    { t: 'Soeverein', s: 'Verwerking zonder afhankelijkheid van Amerikaanse platformen of software: on-premise of soevereine cloud, sleutelbeheer in Nederland.' },\n    { t: 'Epic', s: 'Een samenhangend brok werk met een eigen resultaat: groter dan een feature, kleiner dan een programma.' },\n    { t: 'Portfolio-epic', s: 'De regel in de financiële IV-template, met kostenbandbreedte en FTE-beslag; kan meerdere agile epics bevatten.' },\n    { t: 'Datacapability', s: 'Een samenhangend stuk datafunctionaliteit (rapportage, geo-analyse) dat als geheel migreert: één golf per capability.' },\n    { t: 'FAIR', s: 'Findable, Accessible, Interoperable, Reusable: de datastrategie-principes voor datasets.' },\n    { t: 'Klantdata', s: 'Data over ondernemers en aanvragers uit de uitvoeringsprocessen; startdomein voor data management in 2027.' },\n    { t: 'Human-in/on-the-loop', s: 'Een mens beslist mee (in) of kijkt mee en kan ingrijpen (on). Harde eis bij AI in regelingsprocessen.' },\n    { t: 'DevOps en MLOps', s: 'Bouw en beheer in één team met CI/CD, infrastructuur als code en monitoring; MLOps voegt modelgedrag en data-drift toe.' }\n  ];\n\n  fcc = {\n    PT: [\n      { name: 'Platform (transitie): Strategische ontwikkeling data- & technologielandschap', thema: 'Vernieuwing, Modernisering IV, AI en data', omvang: 'meer dan 1M tot 5M', resources: '3 FTE' },\n      { name: 'Platform (transitie): Strategische capabilityontwikkeling', thema: 'Vernieuwing, Efficiënte en wendbare uitvoering', omvang: '250K tot 500K', resources: 'binnen de 3 FTE' },\n      { name: 'Platform (transitie): Integrale governance & besluitvorming', thema: 'Vernieuwing, Efficiënte en wendbare uitvoering', omvang: '<250K', resources: 'binnen de 3 FTE' }\n    ]\n  };\n\n  epics = {\n    A1: { theme: 'AI', name: 'Soeverein AI-platform', quarters: 'Q1 t/m Q4 2027',\n      short: 'Naast een calamiteitenplan ook een soeverein alternatief realiseren (on-prem of soevereine cloud) van hoogwaardige kwaliteit.',\n      desc: 'Naast een calamiteitenplan ook een soeverein alternatief realiseren, in de vorm van on-prem of soevereine alternatieven van hoogwaardige kwaliteit, passend bij onze AI-ambities. Het huidige platform DADEL GDP draait onder de motorkap op Amerikaanse platformen en software. Door de geopolitieke spanningen maakt dat ons te afhankelijk daarvan en beperkt het het verwerken van vertrouwelijke en AVG-gevoelige data in AI-oplossingen. In 2027 moet dat soevereine alternatief er zijn.',\n      waarde: 'Minder afhankelijk van Amerikaanse platformen en software, relevant gezien de geopolitieke spanningen. Vertrouwelijke en AVG-data kunnen verwerken in AI-oplossingen, wat nu niet kan. Digitale weerbaarheid bij geopolitieke verstoring.',\n      resultaat: 'Een operationeel, hoogwaardig soeverein alternatief (on-prem of soevereine cloud) dat voldoet aan de AI-specifieke eisen: modelhosting zonder Amerikaanse afhankelijkheid, inference op AVG-gevoelige data, een eigen vector-store voor RAG, sleutelbeheer in Nederland en logging van prompts en modelgebruik. Plus een getest calamiteitenplan met beproefde verplaatsing voor minstens één product in productie.',\n      thema: 'Efficiënte en wendbare uitvoering, AI en data, Modernisering IV',\n      deps: ['P2'], extern: 'DICTU, CIO-office, Cloudbeleid Rijk', omvang: 'Nader te bepalen', fase: 'Trechter van initiatieven',\n      componenten: 'DADEL GDP, on-prem / soevereine cloud, LLM-stack' },\n    A2: { theme: 'AI', name: 'Procesoptimalisatie met AI', quarters: 'Q2 t/m Q4 2027',\n      short: 'Eén tot twee regelingsprocessen herontwerpen met AI als processtap; human-in/on-the-loop is een harde eis.',\n      desc: 'Eén tot twee regelingsprocessen herontwerpen met AI als processtap. Human-in/on-the-loop is daarbij een harde eis. De herbruikbare componenten worden als platformdienst beschikbaar gesteld.',\n      waarde: 'Snellere en efficiëntere uitvoering van regelingsprocessen. Herbruikbare bouwblokken die andere teams ook kunnen inzetten, in plaats van dat elk team opnieuw het wiel uitvindt.',\n      resultaat: 'Minstens één regelingsproces met AI als processtap in productie, met human-in/on-the-loop geborgd. De herbruikbare componenten zijn beschikbaar als platformdienst.',\n      thema: 'Efficiënte en wendbare uitvoering (evt. Klantgerichte dienstverlening)',\n      deps: ['A3'], extern: 'Directies met regelingsprocessen, juridische toets', omvang: 'Nader te bepalen', fase: 'Trechter van initiatieven',\n      componenten: 'AI-platformdiensten, procesorkestratie' },\n    A3: { theme: 'AI', name: 'AI-marktplaats en doorontwikkeling platformdiensten', quarters: 'Q1 t/m Q4 2027',\n      short: 'Eén AI-marktplaats voor herbruikbare componenten, plus hosting en doorontwikkeling van de AI-producten op DADEL GDP.',\n      desc: 'Experimentele en beheerde AI-omgevingen faciliteren voor data- en decentrale teams. Hosten van de AI-oplossingen die op DADEL GDP draaien: RVO GPT, AI-migo, de I&A-chatbots en AI agents. Doorontwikkeling van bestaande producten.',\n      waarde: 'Teams hergebruiken geschreven code in plaats van dezelfde solution opnieuw te bouwen: in 2026 zijn 10+ vergelijkbare chatbots gemaakt. Het platform wordt een marktplaats voor herbruikbare AI-componenten.',\n      resultaat: 'Actuele AI-producten (RVO GPT, AI-migo, de I&A-chatbots, AI agents) die functioneel competitief zijn met publieke SaaS-modellen zoals die van Anthropic en OpenAI, en die de dagelijkse taken van de RVO-medewerker ondersteunen.',\n      thema: 'Efficiënte en wendbare uitvoering, AI en data',\n      deps: [], extern: 'DICTU (DADEL GDP), decentrale teams, Generieke Voorzieningen', omvang: 'Nader te bepalen', fase: 'In uitvoering',\n      componenten: 'DADEL GDP, RVO GPT, AI-migo, I&A-chatbots' },\n    A4: { theme: 'AI', name: 'Fundament voor agentic AI', quarters: 'Q1 t/m Q3 2027',\n      short: 'Platform- en governance-randvoorwaarden voor agentic AI doorbouwen: monitoring, eigenaarschap, containment en noodstop.',\n      desc: 'In Q4 2026 hebben de eerste teams de stap naar agentic AI gezet. IDAI bouwt in 2027 de platform- en governance-randvoorwaarden hiervoor door: monitoring, eigenaarschap, containment en noodstop. Dit doen we samen met de innovatiehubs (iNova, DIL): de use cases komen daar vandaan, de beheerde voorziening komt van IDAI. Zo versterken we organisatiebreed de waarde in plaats van per hub een eigen oplossing.',\n      waarde: 'IDAI positioneert zich als technisch partner voor de CIO-richting op agentic AI, zodra die is bepaald. Teams en innovatiehubs kunnen onder governance agentic toepassingen bouwen, in plaats van ongecontroleerde wildgroei.',\n      resultaat: 'Een beheerde agentic-voorziening waarop teams en de innovatiehubs onder governance agentic toepassingen kunnen draaien.',\n      thema: 'AI en data, Efficiënte en wendbare uitvoering',\n      deps: ['A6'], extern: 'iNova / DIL (innovatiehubs), Generieke Voorzieningen, CIO-richting agentic AI (nog te bepalen)', omvang: 'Nader te bepalen', fase: 'Trechter van initiatieven',\n      componenten: 'Agent-runtime, monitoring, containment/noodstop' },\n    A5: { theme: 'AI', name: 'AI-management in bestaande processen', quarters: 'Q2 t/m Q4 2027',\n      short: 'Periodieke hertoetsing structureel inbedden in het IV-deelportfolioproces, SaaS-inkoop en business-procesherontwerp.',\n      desc: 'AI-governance is geen eenmalige toets voor livegang, maar een doorlopend proces. Een goedgekeurde toepassing verandert daarna: een nieuw model, een release, uitgebreide functionaliteit of veranderend gebruik maakt een eerdere DPIA, IAMA of BIO QuickScan ongeldig. Dit epic bedt periodieke hertoetsing structureel in bestaande processen in: het IV-deelportfolioproces, SaaS-inkoop en business-procesherontwerp. Compliant blijven vraagt ook functionaliteit: geautomatiseerd scannen van het documenttype en de gevoeligheid bij upload, blokkeren van verwerking buiten de toegestane dataclassificatie, en een signaal bij een nieuw model of een nieuwe release zodat de hertoets afgaat.',\n      waarde: 'De beoordeling zit in het proces zelf en deels in de techniek. Governance groeit mee zonder aparte flessenhals.',\n      resultaat: 'Een duidelijk en uitvoerbaar beleid voor AI-producten, met geautomatiseerde controles ingebouwd (scan op documenttype en gevoeligheid bij upload, blokkade buiten de classificatie, hertoetssignaal bij model- of releasewijziging). AI-producten worden continu gemonitord, werkend ingeregeld in de drie processen.',\n      thema: 'Efficiënte en wendbare uitvoering (evt. Modernisering IV)',\n      deps: [], extern: 'CDO Office, AI Regiepunt (tijdelijk), inkoop, privacy/BIO', omvang: 'Nader te bepalen', fase: 'Trechter van initiatieven',\n      componenten: 'DPIA / IAMA / BIO QuickScan, DP-proces' },\n    A6: { theme: 'AI', name: 'DevOps voor AI-producten', quarters: 'Q1 t/m Q3 2027',\n      short: 'Een beheerde AI-pipeline inrichten volgens DevOps en, voor modellen, MLOps: CI/CD, IaC, compliance-as-code en monitoring.',\n      desc: 'We hebben veel Dev, maar nog geen Ops. Overal in de organisatie lopen lokale en externe AI-ontwikkelingen, maar die worden nergens structureel beheerd. Daardoor komen ze niet in productie, of blijven ze geen duurzaam product. Dit epic richt een beheerde AI-pipeline in volgens DevOps en, voor modellen, MLOps: CI/CD, infrastructuur als code, geautomatiseerde compliance-controles in de release en monitoring op modelgedrag en data-drift. Van toepassing op LLM-, RAG- en agentic-oplossingen. We kiezen bewust voor DevOps en niet voor een gescheiden OPS-team: beheer op AI gaat over modelgedrag, prompts, datakwaliteit en drift, en dat vraagt dezelfde kennis als de bouw. Een aparte overdracht kost snelheid, maakt eigenaarschap diffuus en is bij tientallen kleine AI-producten niet te bemannen. Wat generiek is (monitoring, pipeline, compliance-checks) beleggen we wel centraal, als platformdienst.',\n      waarde: 'Veel initiatieven halen de productie niet. Met AI Ops erbij blijven meer AI-oplossingen in gebruik, en krijgen we hergebruik en grip op het portfolio.',\n      resultaat: 'Elk AI-product van RVO draait via deze pipeline, heeft een benoemde eigenaar en wordt na livegang gemonitord. Producten die productiewaardig en gefinancierd zijn, gaan in beheer.',\n      thema: 'Efficiënte en wendbare uitvoering (evt. AI en data)',\n      deps: ['A3'], extern: 'DICTU, bouwteams', omvang: 'Nader te bepalen', fase: 'Trechter van initiatieven',\n      componenten: 'CI/CD, IaC, MLOps-monitoring, compliance-as-code' },\n\n    D7: { theme: 'KD', name: 'Dataclassificatie en plaatsing (voorheen P1)', quarters: 'Q1 t/m Q2 2027',\n      short: 'Per bron en per dataset bepalen welke data waar geplaatst mag worden.',\n      desc: 'Hoe bepalen we, per bron en per dataset, welke data waar geplaatst mag worden, zodat elke dataset aantoonbaar voldoet aan het soevereiniteits- en Cloudbeleid én aan de FAIR-principes uit de datastrategie?',\n      waarde: 'Hier begint het datafundament: pas als vastligt welke data waar mag staan, heeft RVO de juiste data op het juiste moment beschikbaar. Op basis van de feedback is dit epic verplaatst van Platform Transitie naar Datamanagement, omdat het over metadata, classificatie en autorisatie per dataset gaat.',\n      resultaat: 'Nader te bepalen in het programmaplan; classificatie is randvoorwaarde voor de eerste migratiegolf én voor de policy engine (D4).',\n      thema: 'Modernisering IV, AI en data',\n      deps: [], extern: 'Beleid, besluitvorming, budget, DICTU', omvang: 'meer dan 1M tot 5M (portfolio-epic)', fase: '1. Trechter van initiatieven',\n      componenten: 'Nader te bepalen' },\n    P2: { theme: 'PT', name: 'Doelarchitectuur (hybride)', quarters: 'Q1 t/m Q3 2027',\n      short: 'Alleen de architectuurplaat: hybride, functioneel gelijkwaardig aan SAS en GEO en houdbaar onder het Cloudbeleid. Implementatie valt onder P3.',\n      desc: 'Welke hybride architectuur is functioneel gelijkwaardig aan SAS en GEO, houdbaar onder het geldende Cloudbeleid, en ingericht volgens het principe van werken onder (data)architectuur? De scope is de doelarchitectuur zelf, niet de implementatie: die zit in de migratiegolven (P3). De kostenindicatie is daarop naar beneden bijgesteld.',\n      waarde: 'Strategische richting bepalen voor architectuur, platformen, technologie, standaarden, open source, interoperabiliteit en technologische afhankelijkheden, zodat RVO beschikt over schaalbare, herbruikbare en beheersbare datavoorzieningen zonder onnodige afhankelijkheden.',\n      resultaat: 'Nader te bepalen in het programmaplan; vastgestelde doelarchitectuur GDP cloud + GDP on-premise.',\n      thema: 'Vernieuwing, Modernisering IV, AI en data',\n      deps: ['D7'], extern: 'Beleid, besluitvorming, budget, DICTU', omvang: 'lager dan eerder opgegeven, alleen de plaat (portfolio-epic)', fase: '1. Trechter van initiatieven',\n      componenten: 'GDP cloud (Azure, Databricks), GDP on-premise' },\n    P3: { theme: 'PT', name: 'Migratiegolf per domein', quarters: 'Vanaf Q3 2027',\n      short: 'Herbruikbaar epic, één instantie per golf: een datacapability-domein migreren van SAS/GEO naar het GDP.',\n      desc: 'Hoe migreren we een datacapability-domein van SAS/GEO naar het GDP zonder de beschikbaarheid van data voor klanten en opdrachtgevers te verstoren? Herbruikbaar epic: één instantie per golf.',\n      waarde: 'SAS en GEO stap voor stap vervangen, per capability. Dit volgt het samenwerkingsmodel dat de strategie voorschrijft: centraal wat moet, decentraal wat kan.',\n      resultaat: 'Nader te bepalen per golf; eerste golf gestart in 2027, programmaduur 5 tot 7 jaar.',\n      thema: 'Vernieuwing, Modernisering IV, AI en data',\n      deps: ['D7', 'P2'], extern: 'DICTU, domeineigenaren, opdrachtgevers', omvang: 'Nader te bepalen per golf', fase: '1. Trechter van initiatieven',\n      componenten: 'SAS, GEO, GDP cloud, GDP on-premise' },\n    P4: { theme: 'PT', name: 'Governance zonder tunnelvisie', quarters: 'Q1 t/m Q2 2027',\n      short: 'Besluitvorming die architectuur- en golfbesluiten structureel toetst op tegenargumenten en reflectie.',\n      desc: 'Hoe richten we besluitvorming in die architectuur- en golfbesluiten structureel toetst op tegenargumenten en reflectie, conform de balans tussen doelmatigheid en publieke waarden uit de strategie?',\n      waarde: 'Organiseren van kaders, besluitvorming, tegenkracht en samenhangende afweging van strategische keuzes over initiatieven heen: een stuurgroep met een vaste tegenspraakrol en (externe) toetsing.',\n      resultaat: 'Nader te bepalen; stuurgroep met tegenspraakrol operationeel.',\n      thema: 'Vernieuwing, Efficiënte en wendbare uitvoering',\n      deps: [], extern: 'Beleid, besluitvorming, budget', omvang: '<250K (portfolio-epic)', fase: '1. Trechter van initiatieven',\n      componenten: 'Nader te bepalen' },\n    P5: { theme: 'PT', name: 'Opleiding en verandercapaciteit', quarters: 'Q2 t/m Q4 2027',\n      short: 'Per rol het vakmanschap en de cultuur ontwikkelen die nodig zijn om datagedreven te werken.',\n      desc: 'Hoe ontwikkelen medewerkers, per rol, het vakmanschap en de cultuur die nodig zijn om daadwerkelijk datagedreven te werken, zoals de strategie dit van RVO vraagt?',\n      waarde: 'Gericht opleiden per rol, herhaald per golf (bouwsteen mensen: cultuur, vakmanschap en ontwikkeling). Zonder vakmanschap geen datagedreven cultuur.',\n      resultaat: 'Nader te bepalen; benodigde capabilities, rollen en capaciteit structureel inzichtelijk en in ontwikkeling.',\n      thema: 'Vernieuwing, Efficiënte en wendbare uitvoering',\n      deps: ['P4'], extern: 'HR / functiehuis, directies', omvang: '250K tot 500K (portfolio-epic)', fase: '1. Trechter van initiatieven',\n      componenten: 'Nader te bepalen' },\n    P6: { theme: 'PT', name: \"Meetbare sturing\", quarters: 'Q1 t/m Q4 2027',\n      short: 'Voortgang, kosten en adoptie per fase zichtbaar en verantwoordbaar maken.',\n      desc: 'Hoe maken we voortgang, kosten en adoptie per fase zichtbaar en verantwoordbaar, zodat aantoonbaar wordt dat dit programma bijdraagt aan een excellente dienstverlening met zichtbare maatschappelijke impact?',\n      waarde: \"KPI's, OKR's en een onderbouwde meerjarenraming per fase. Dit maakt de bijdrage aan de datastrategie aantoonbaar in plaats van alleen een intentie.\",\n      resultaat: 'Nader te bepalen; kwartaalrapportage op voortgang, kosten en adoptie.',\n      thema: 'Vernieuwing, Efficiënte en wendbare uitvoering',\n      deps: ['P4'], extern: 'F&C, portfolioboard', omvang: '<250K (portfolio-epic)', fase: '1. Trechter van initiatieven',\n      componenten: 'Nader te bepalen' },\n\n    D1: { theme: 'KD', name: 'Begrippenkader (data begrijpelijk)', quarters: 'Q1 t/m Q3 2027',\n      short: \"Eén voorziening voor begrippen en KPI-definities, in plaats van SharePoint. Start bij klantdata.\",\n      desc: \"We selecteren, implementeren en vullen één centrale voorziening voor begrippen en KPI-definities, in plaats van de huidige SharePoint-oplossing. We starten bij klantdata.\",\n      waarde: \"Gedeelde taal binnen RVO, zodat dezelfde vraag hetzelfde antwoord oplevert; herbruikbare KPI's en definities; aansluiting op rijksbrede begrippen.\",\n      resultaat: 'Begrippenkader operationeel en gevuld met klantdatabegrippen; belegd eigenaarschap; werkwijze voor onboarden van volgende domeinen staat.',\n      thema: 'Klantgerichte dienstverlening, Efficiënte en wendbare uitvoering, Modernisering IV, Data AI',\n      deps: [], extern: 'Rijksbrede begrippenkaders, domeineigenaren', omvang: 'Nader te bepalen', fase: 'Trechter van initiatieven',\n      componenten: 'Business glossary-voorziening' },\n    D2: { theme: 'KD', name: 'Datacatalogus (data vindbaar)', quarters: 'Q1 t/m Q3 2027',\n      short: 'Centrale metadata-voorziening waarin datasets vindbaar, beschreven en te herleiden (lineage) zijn; gestart met klantdatasets.',\n      desc: 'We selecteren, implementeren en vullen één metadata-voorziening: datasets zijn er vindbaar, beschreven en te herleiden (lineage). We starten bij de klantdatasets.',\n      waarde: 'Datasets vindbaar en herbruikbaar; einde aan zoekwerk en dubbelwerk; fundament voor de Data & AI Marktplaats.',\n      resultaat: 'Datacatalogus operationeel; klantdatasets ontsloten met metadata en lineage; verkenning koppeling BI/AI-platform gestart.',\n      thema: 'Klantgerichte dienstverlening, Efficiënte en wendbare uitvoering, Modernisering IV, Data AI',\n      deps: [], extern: 'BI/AI-platform, bronsysteemeigenaren', omvang: 'Nader te bepalen', fase: 'Trechter van initiatieven',\n      componenten: 'Metadata-repository, lineage' },\n    D3: { theme: 'KD', name: 'Datakwaliteit (data betrouwbaar)', quarters: 'Q2 t/m Q4 2027',\n      short: 'Tooling om datakwaliteit aan de bron te meten en monitoren; kwaliteitseisen afgedwongen op klantdata-bronsystemen (start UPJZ/UPEU).',\n      desc: 'We meten en monitoren datakwaliteit aan de bron met daarvoor geselecteerde tooling, en dwingen kwaliteitseisen af op de klantdata-bronsystemen. We beginnen bij UPJZ en UPEU.',\n      waarde: 'Aantoonbare kwaliteit van klantdata; vertrouwen in het datafundament; werkend escalatiepad naar bron-eigenaren.',\n      resultaat: \"Datakwaliteitssysteem operationeel; kwaliteits-KPI's klantdata gerapporteerd; escalatiepad naar bron-eigenaren werkend.\",\n      thema: 'Klantgerichte dienstverlening, Efficiënte en wendbare uitvoering, Modernisering IV, Data AI',\n      deps: ['D2'], extern: 'UPJZ, UPEU, bron-eigenaren', omvang: 'Nader te bepalen', fase: 'Trechter van initiatieven',\n      componenten: 'Data quality-tooling, monitoring' },\n    D4: { theme: 'KD', name: 'Beleidsgestuurde toegang (policy engine)', quarters: 'Q2 t/m Q4 2027',\n      short: 'Policy engine die toegang tot klantdata geautomatiseerd afdwingt op basis van beleid en grondslagen.',\n      desc: 'We implementeren een policy engine die toegang tot klantdata automatisch afdwingt op basis van beleid en grondslagen. De verantwoording zit in de workflow zelf.',\n      waarde: 'Verantwoorde ontsluiting van klantdata mogelijk; geautomatiseerde grondslagtoetsing; opschaling naar bredere herbruikbaarheid ontgrendeld.',\n      resultaat: 'Policy engine werkend voor klantdata; classificatie klantdata uitgevoerd; verantwoording geïntegreerd in de workflow.',\n      thema: 'Klantgerichte dienstverlening, Modernisering IV, Data AI',\n      deps: ['D7', 'D1'], extern: 'Privacy/juridisch, CDO Office', omvang: 'Nader te bepalen', fase: 'Trechter van initiatieven',\n      componenten: 'Policy engine, classificatie, workflow' },\n    D5: { theme: 'KD', name: 'Masterdata en referentiedata', quarters: 'Q3 t/m Q4 2027',\n      short: 'Gezaghebbende lijsten en referentiedata voor klantdata inventariseren, schonen en vullen; aansluiting basisregistraties voorbereiden.',\n      desc: 'We inventariseren, schonen en vullen de gezaghebbende lijsten en referentiedata voor klantdata, en houden de kwaliteit bij. Daarnaast bereiden we de aansluiting op de basisregistraties voor: BRK, BGT, BAG, RDW en KvK.',\n      waarde: 'Eenduidige waarden voor klantdata; einde aan meerdere waarheden per systeem; hergebruik van rijksbrede gezaghebbende bronnen.',\n      resultaat: 'Gezaghebbende lijsten klantdata belegd en gevuld; koppeling met begrippenkader werkend; aansluiting basisregistraties voorbereid of gestart.',\n      thema: 'Klantgerichte dienstverlening, Efficiënte en wendbare uitvoering, Modernisering IV, Data AI',\n      deps: ['D1'], extern: 'BRK, BGT, BAG, RDW, KvK', omvang: 'Nader te bepalen', fase: 'Trechter van initiatieven',\n      componenten: 'MDM / referentiedata, basisregistratie-koppelingen' },\n    D6: { theme: 'KD', name: 'Data en AI Marktplaats (één ingang)', quarters: 'Vanaf Q4 2027',\n      short: 'Brengt business glossary, datacatalogus en metadata-repository samen in één ingang.',\n      desc: 'De datamarktplaats brengt drie dingen samen die nu los van elkaar bestaan: de business glossary (welke begrippen hanteren we), de datacatalogus (welke bronnen en producten zijn er) en de metadata-repository (wat weten we ervan).',\n      waarde: 'Data is vindbaar, eenduidig en beheerst te benaderen via één ingang, waarbij verantwoording als bijproduct plaatsvindt.',\n      resultaat: 'Begrippenkader, datacatalogus en datakwaliteitsregels zijn na te slaan in één interactief overzicht. De policy engine werkt voor de gepubliceerde bronnen, en de gezaghebbende lijsten, referentiedata en basisregistraties zijn beschikbaar.',\n      thema: 'Klantgerichte dienstverlening, Efficiënte en wendbare uitvoering, Modernisering IV, Data AI',\n      deps: ['D1', 'D2', 'D3', 'D4', 'D5'], extern: 'BI/AI-platform, DICTU', omvang: 'Nader te bepalen', fase: 'Trechter van initiatieven',\n      componenten: 'Glossary + catalogus + metadata-repository, policy engine' },\n    D8: { theme: 'KD', name: 'Financieel solide', quarters: 'Q1 t/m Q4 2027',\n      short: 'Datalevering, begrippen en kwaliteitsregels voor het programma Financieel Solide; financiering nog af te stemmen.',\n      desc: 'Het programma Financieel Solide raakt zowel platformtransitie als data management. Op basis van de feedback is het als epic onder Datamanagement belegd: de financiële begrippen en KPI-definities landen in het begrippenkader (D1), de brondata en kwaliteitsregels in D2 en D3, en de toegang tot financiële data loopt via de policy engine (D4).',\n      waarde: 'Het programma krijgt data die aansluit op één begrippenkader, in plaats van eigen definities en eigen extracties. Verantwoording over financiële cijfers wordt herleidbaar.',\n      resultaat: 'Financiële begrippen en KPI-definities opgenomen in het begrippenkader, brondata ontsloten via de catalogus met kwaliteitsregels, en een werkende rapportagelijn voor het programma.',\n      thema: 'Efficiënte en wendbare uitvoering, Modernisering IV',\n      deps: ['D1', 'D2', 'D3'], extern: 'Programma Financieel Solide, F&C; financiering af te stemmen (actie Carolien)', omvang: 'Nog niet belegd, financiering open', fase: 'Trechter van initiatieven',\n      componenten: 'Begrippenkader, datacatalogus, rapportagelijn' }\n  };\n\n  doelLabels = { KGD: 'Klantgerichte dienstverlening', MIV: 'Modernisering IV', AID: 'AI en data', EWU: 'Efficiënte en wendbare uitvoering', IM: 'Impactmonitoring' };\n\n  doelMap = {\n    A1: { d: ['EWU', 'AID', 'MIV'], e: [] },\n    A2: { d: ['EWU'], e: ['KGD'] },\n    A3: { d: ['EWU'], e: ['AID'] },\n    A4: { d: ['AID'], e: ['EWU'] },\n    A5: { d: ['EWU'], e: ['MIV'] },\n    A6: { d: ['EWU'], e: ['AID'] },\n    P2: { d: ['MIV', 'AID'], e: [] },\n    P3: { d: ['MIV', 'AID'], e: [] },\n    P4: { d: ['EWU'], e: [] },\n    P5: { d: ['EWU'], e: [] },\n    P6: { d: ['EWU'], e: ['IM'] },\n    D1: { d: ['KGD', 'EWU', 'MIV', 'AID'], e: [] },\n    D2: { d: ['KGD', 'EWU', 'MIV', 'AID'], e: [] },\n    D3: { d: ['KGD', 'EWU', 'MIV', 'AID'], e: [] },\n    D4: { d: ['KGD', 'MIV', 'AID'], e: [] },\n    D5: { d: ['KGD', 'EWU', 'MIV', 'AID'], e: [] },\n    D6: { d: ['KGD', 'EWU', 'MIV', 'AID'], e: [] },\n    D7: { d: ['MIV', 'AID'], e: [] },\n    D8: { d: ['EWU', 'MIV'], e: [] }\n  };\n\n  doelRows() {\n    const codes = Object.keys(this.doelMap);\n    const cell = (goal, pfx) => {\n      const prim = [], ev = [];\n      codes.filter(c => c[0] === pfx).forEach(c => {\n        if (this.doelMap[c].d.includes(goal)) prim.push(c);\n        else if (this.doelMap[c].e.includes(goal)) ev.push(c);\n      });\n      return { p: prim.length ? prim.join(', ') : '—', e: ev.length ? 'evt. ' + ev.join(', ') : '' };\n    };\n    return ['KGD', 'MIV', 'AID', 'EWU', 'IM'].map(g => {\n      const ai = cell(g, 'A'), pt = cell(g, 'P'), dm = cell(g, 'D');\n      return { label: this.doelLabels[g], ai: ai.p, aiE: ai.e, pt: pt.p, ptE: pt.e, dm: dm.p, dmE: dm.e };\n    });\n  }\n\n  go = (patch) => this.setState(patch);\n\n  onClick = (e) => {\n    const el = e.target.closest('[data-epic],[data-theme],[data-nav]');\n    if (!el) return;\n    const ep = el.getAttribute('data-epic');\n    const th = el.getAttribute('data-theme');\n    const nav = el.getAttribute('data-nav');\n    if (ep && this.epics[ep]) this.go({ view: 'epic', epic: ep, theme: this.epics[ep].theme });\n    else if (th) this.go({ view: 'theme', theme: th, epic: null });\n    else if (nav === 'overview') this.go({ view: 'overview', theme: null, epic: null });\n    else if (nav === 'theme') this.go({ view: 'theme', epic: null });\n  };\n\n  renderVals() {\n    const v = this.state.view;\n    const th = this.themes[this.state.theme] || { title: '', intro: '', owner: '', horizon: '' };\n    const mk = k => {\n      const e = this.epics[k];\n      return { code: k, name: e.name, short: e.short, resultaat: e.resultaat, quarters: e.quarters,\n        depsLabel: e.deps.length ? 'Afhankelijk van ' + e.deps.join(', ') : 'Geen interne afhankelijkheden' };\n    };\n    const list = Object.keys(this.epics).filter(k => this.epics[k].theme === this.state.theme).map(mk);\n    const doelGroups = (th.doelen || []).map(d => ({\n      nr: 'Doelstelling ' + d.nr, label: d.label, thema: d.thema,\n      epics: d.epics.filter(k => this.epics[k]).map(mk)\n    }));\n    const ep = this.epics[this.state.epic] || null;\n    const dm = this.doelMap[this.state.epic] || null;\n    return {\n      onClick: this.onClick,\n      doelRows: this.doelRows(),\n      epicDoelen: dm ? dm.d.map(k => ({ label: this.doelLabels[k] })) : [],\n      epicDoelenEvt: dm ? dm.e.map(k => ({ label: this.doelLabels[k] })) : [],\n      hasDoelenEvt: !!(dm && dm.e.length),\n      isOverview: v === 'overview', isTheme: v === 'theme', isEpic: v === 'epic',\n      showDeps: this.props.showDependencies ?? true,\n      showResultaat: this.props.showResultaat ?? true,\n      themeTitle: th.title, themeIntro: th.intro, themeOwner: th.owner, themeHorizon: th.horizon,\n      themeCount: list.length + ' agile epics',\n      themeEpics: list, doelGroups,\n      openPunten: this.openPunten, begrippen: this.begrippen,\n      hasFcc: !!this.fcc[this.state.theme], fccRows: this.fcc[this.state.theme] || [],\n      epicCode: this.state.epic || '', epicName: ep ? ep.name : '', epicQuarters: ep ? ep.quarters : '',\n      epicDesc: ep ? ep.desc : '', epicWaarde: ep ? ep.waarde : '', epicResultaat: ep ? ep.resultaat : '',\n      epicThema: ep ? ep.thema : '',\n      epicDeps: ep ? (ep.deps.length ? ep.deps.map(d => d + ' ' + this.epics[d].name).join(', ') : 'Geen interne afhankelijkheden') : '',\n      epicExtern: ep ? ep.extern : '', epicOmvang: ep ? ep.omvang : '', epicFase: ep ? ep.fase : '',\n      epicComponenten: ep ? ep.componenten : ''\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
